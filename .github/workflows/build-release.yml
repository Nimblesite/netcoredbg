---
# Builds this fork's patched netcoredbg for every platform SharpLsp bundles and
# publishes the archives to a GitHub release, each with a SHA-256 file and a
# build-provenance attestation. SharpLsp pins these URLs and digests in
# tools/netcoredbg/netcoredbg.lock.json and only ever downloads them.
#
# Run it (workflow_dispatch) after changing the debugger source; then repin the
# lock file from the printed digests.
name: Build release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the archives under.
        required: true
        default: 3.2.0-1092-sharplsp.1
env:
  # CoreCLR sources netcoredbg compiles against (dotnet/runtime).
  CORECLR_COMMIT: ea346eaeda73d7ef1cc3b148939ac83729cc38dc
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: win32-x64
            runner: windows-latest
          - platform: darwin-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.303
      - name: Fetch the pinned CoreCLR sources
        shell: bash
        run: |-
          set -euo pipefail
          mkdir -p coreclr
          git -C coreclr init --quiet
          git -C coreclr remote add origin https://github.com/dotnet/runtime.git
          git -C coreclr fetch --quiet --depth 1 origin "$CORECLR_COMMIT"
          git -C coreclr checkout --quiet --detach FETCH_HEAD
      - name: Build
        shell: bash
        run: |-
          set -euo pipefail
          DOTNET_DIR="${DOTNET_ROOT:-$(cd "$(dirname "$(command -v dotnet)")" && pwd)}"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            DOTNET_DIR="$(cygpath -m "$DOTNET_DIR")"
          fi
          CMAKE_ARGS=(
            -S . -B build
            -DCORECLR_DIR="$PWD/coreclr/src/coreclr"
            -DDOTNET_DIR="$DOTNET_DIR"
            -DCMAKE_INSTALL_PREFIX="$PWD/out/netcoredbg"
            -DCMAKE_BUILD_TYPE=Release
          )
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            cmake "${CMAKE_ARGS[@]}" -A x64
          else
            CC="${CC:-clang}" CXX="${CXX:-clang++}" cmake "${CMAKE_ARGS[@]}"
          fi
          cmake --build build --config Release --parallel
          cmake --install build --config Release
          ls out/netcoredbg
      - name: Archive
        shell: bash
        # SharpLsp extracts with `tar -xf <archive> --strip-components=1
        # netcoredbg`, so the archive holds exactly one leading `netcoredbg/`
        # directory. Paths stay relative: GNU tar reads a colon as host:path.
        run: |-
          set -euo pipefail
          ( cd out && tar -czf "netcoredbg-${{ matrix.platform }}.tar.gz" netcoredbg )
          mv "out/netcoredbg-${{ matrix.platform }}.tar.gz" .
          node -e '
            const {createHash}=require("node:crypto"), {readFileSync,writeFileSync}=require("node:fs");
            const f=process.argv[1];
            const digest=createHash("sha256").update(readFileSync(f)).digest("hex");
            writeFileSync(f+".sha256", digest+"  "+f+"\n");
            console.log(digest, f);
          ' "netcoredbg-${{ matrix.platform }}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netcoredbg-${{ matrix.platform }}
          path: |
            netcoredbg-${{ matrix.platform }}.tar.gz
            netcoredbg-${{ matrix.platform }}.tar.gz.sha256

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Records who built these bytes, from which commit, in which workflow -
      # the half of "chain of custody" a checksum cannot supply.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: netcoredbg-*
          merge-multiple: true
          path: archives
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: archives/*.tar.gz
      - name: Publish the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |-
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Patched netcoredbg for SharpLsp (applyDeltas over DAP + stepping from symbol-less frames). Pinned by SharpLsp's tools/netcoredbg/netcoredbg.lock.json."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" archives/* --clobber
      - name: Print the digests to pin
        shell: bash
        run: cat archives/*.sha256
